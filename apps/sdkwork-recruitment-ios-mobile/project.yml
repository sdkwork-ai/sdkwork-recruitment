name: SDKWork Recruitment
options:
  bundleIdPrefix: com.sdkwork.recruitment
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
targets:
  SdkworkRecruitmentIosMobile:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: SDKWork Recruitment
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sdkwork.recruitment
